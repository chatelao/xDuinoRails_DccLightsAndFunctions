name: Compile Examples

on:
  push:
    branches: [ "main", "**" ]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Compile examples
        uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          sketch-paths: |
            - examples/ae6-6-neopixel
          libraries: |
            - source-path: ./
            - name: Servo
            - name: Adafruit NeoPixel
            - name: FastLED
          cli-compile-flags: |
            - --build-property
            - "build.extra_flags=-std=gnu++11"
